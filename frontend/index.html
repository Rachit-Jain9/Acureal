<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acureal — the intelligence layer for Indian real estate. India-first underwriting, diligence, and IC-ready reporting for GPs and institutional investors." />
    <meta name="theme-color" content="#050507" />
    <title>Acureal — Real Estate Deal Intelligence</title>
    <meta property="og:site_name" content="Acureal" />
    <meta property="og:title" content="Acureal — Real Estate Deal Intelligence" />
    <meta property="og:description" content="The intelligence layer for Indian real estate. Underwriting, diligence, and IC-ready reporting for GPs and institutional investors." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://acureal.in" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Prime the theme attribute before React mounts to avoid a flash
      (function () {
        try {
          var saved = localStorage.getItem('redip.theme');
          var mode = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.classList.toggle('dark', mode === 'dark');
          document.documentElement.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Jost:wght@200;300;400&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
