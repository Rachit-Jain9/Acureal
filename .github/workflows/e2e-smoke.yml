name: E2E Smoke (production)

# Playwright smoke suite that click-tests the LIVE site. Every assertion maps to
# a bug that actually shipped to the operator in July 2026 (empty dashboard/Deals
# from the pooler org-context race, NaN comp chips, missing Activity share panel,
# broken XLSX export). This is the net that catches those regressions.
#
# It runs against PRODUCTION, three ways:
#   • after every production deploy (deployment_status) — validates each merge on
#     the real environment within ~1 min, before the operator would notice;
#   • daily (schedule) — a synthetic monitor for the "healthy 200 but empty" class
#     Sentry can't see (no error is thrown) and any drift between deploys;
#   • on demand (workflow_dispatch) — against any URL you pass.
#
# Why production and not PR previews: previews sit behind Vercel Deployment
# Protection. The E2E_BYPASS_SECRET gets the browser past the SSO wall, but the
# login round-trip behaves differently through the protected-preview edge, so a
# preview run is flaky in a way that has nothing to do with the app. Production
# is public and rock-solid, and testing every merge the moment it goes live is
# robust coverage. Pre-merge preview testing can be revisited later (see the ops
# plan); the bypass secret is kept for a manual workflow_dispatch against a
# specific preview URL.
#
# ADVISORY (non-blocking): intentionally NOT a required check yet, so a red run
# surfaces a real signal without blocking merges while confidence builds. Promote
# to required once it's proven stable.

on:
  deployment_status:
  schedule:
    - cron: '0 2 * * *' # daily 02:00 UTC ≈ 07:30 IST
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL to test (defaults to production)'
        required: false
        default: 'https://acureal.in'

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.event.deployment_status.environment_url || github.event.inputs.base_url || 'prod' }}
  cancel-in-progress: true

jobs:
  smoke:
    # Run for a manual dispatch, the daily schedule, or a SUCCESSFUL PRODUCTION
    # deployment. Preview deployments are skipped (see header) — they never reach
    # this job, so they never false-red a PR.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment_status.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Resolve target URL
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ github.event.inputs.base_url }}" >> "$GITHUB_OUTPUT"
          else
            # schedule + production deploy → the stable, public production alias.
            echo "url=https://acureal.in" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight — is the target reachable?
        id: reachable
        env:
          BYPASS: ${{ secrets.E2E_BYPASS_SECRET }}
        run: |
          URL="${{ steps.target.outputs.url }}"
          # A bypass secret lets us through Vercel Deployment Protection (only
          # relevant for a manual dispatch against a protected preview URL).
          if [ -n "$BYPASS" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No bypass secret: if the target is behind Vercel Authentication it
          # redirects to vercel.com/sso. That's a config gap, not an app bug —
          # skip (green) with a warning rather than failing red. (Production is
          # public, so this only trips for a dispatch against a protected URL.)
          LOC=$(curl -s -o /dev/null -w "%{redirect_url}" -I "$URL" || true)
          if echo "$LOC" | grep -q "vercel.com/sso"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "### ⚠️ E2E smoke SKIPPED — target is protected" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$URL\` is behind Vercel Deployment Protection and no \`E2E_BYPASS_SECRET\` is set." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=E2E smoke skipped::Target is behind Vercel Deployment Protection and no E2E_BYPASS_SECRET is configured."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run smoke suite
        if: steps.reachable.outputs.run == 'true'
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.url }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
        # html reporter generates playwright-report/ (with failure screenshots +
        # traces) so the artifact upload below has something to upload.
        run: npx playwright test --reporter=github,list,html

      - name: Upload Playwright report
        if: always() && steps.reachable.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
