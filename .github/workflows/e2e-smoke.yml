name: E2E Smoke (preview)

# Runs the Playwright smoke suite against each PR's Vercel preview deployment
# BEFORE it can be promoted to production. Every assertion maps to a bug that
# actually shipped to the operator in July 2026 (empty dashboard/Deals from the
# pooler org-context race, NaN comp chips, missing Activity share panel, broken
# XLSX export). This is the gate those regressions would have tripped.
#
# Trigger: Vercel posts a GitHub `deployment_status` when a preview finishes
# building. We read the live URL from that event, so there's no polling and no
# Vercel token needed — just the test-account secrets.
#
# ADVISORY (non-blocking) for now: this workflow is intentionally NOT added to
# branch protection's required checks, so a red run surfaces a real signal
# without blocking merges while we build confidence. Promote it to required once
# it's proven stable across a few weeks of PRs.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL to test (defaults to production)'
        required: false
        default: 'https://redip.vercel.app'

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.event.deployment_status.target_url || github.event.inputs.base_url }}
  cancel-in-progress: true

jobs:
  smoke:
    # Only for SUCCESSFUL non-production deployments (i.e. PR previews), or a
    # manual dispatch. Skips the production deployment that follows each merge.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment != 'Production' &&
       !contains(github.event.deployment_status.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Resolve target URL
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ github.event.inputs.base_url }}" >> "$GITHUB_OUTPUT"
          else
            # Vercel puts the live site URL in environment_url; target_url can be
            # the inspector link. Prefer environment_url, fall back to target_url.
            URL="${{ github.event.deployment_status.environment_url }}"
            [ -z "$URL" ] && URL="${{ github.event.deployment_status.target_url }}"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Run smoke suite
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.url }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # Optional: only needed if preview URLs are behind Vercel Deployment
          # Protection. Unset = ignored (production is public).
          E2E_BYPASS_SECRET: ${{ secrets.E2E_BYPASS_SECRET }}
        run: npx playwright test --reporter=github,list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
