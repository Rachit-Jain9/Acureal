name: CI

# Gate every PR on backend tests, frontend build + tests, and kernel typecheck + tests.
# Until this exists, the only check is `defaults-staleness.yml` (one JSON-field freshness check).
# This workflow is the "green-build invariant" Bet 1 needs.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Financial kernel
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/financial-kernel/package-lock.json
      - run: npm ci --prefix packages/financial-kernel
      # `npm run build` typechecks against tsconfig.build.json (production config).
      # The plain `npm run typecheck` script uses the looser tsconfig.json that
      # also includes /tests, which can't share a rootDir with /src — that path
      # is jest-only.
      - run: npm run build --prefix packages/financial-kernel
      - run: npm test --prefix packages/financial-kernel -- --ci

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: kernel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      # Build the kernel so the backend can require it (kernel.service ↔ dist/).
      - run: npm ci --prefix packages/financial-kernel
      - run: npm run build --prefix packages/financial-kernel
      - run: npm test --prefix backend -- --ci
        env:
          NODE_ENV: test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev --prefix frontend
      - run: npm run build --prefix frontend
        env:
          # Vite warns on undefined VITE_* in build; surface as failure.
          CI: true
      # Bundle-size budget — fails if a chunk (or the total) exceeds budget,
      # catching heavyweight vendors creeping onto hot routes (see
      # docs/PLATFORM_OPERATIONS_PLAN.md §2 and PR #943's Leaflet finding).
      - run: node frontend/scripts/check-bundle-budget.cjs
      - run: npm test --prefix frontend -- --run

  audit:
    name: Audit & migration lint
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Migration filename + CONCURRENTLY lint
        run: node scripts/lint-migrations.js
      - name: RLS coverage audit (static migration scan)
        # Fails the build if any org-scoped table is created without
        # ENABLE ROW LEVEL SECURITY. Sister of multitenancy_foundation —
        # defense-in-depth against new tables landing without RLS.
        run: python3 scripts/audit_rls.py
      - name: Environment contract (manifest vs source)
        # Fails when a variable is read in code but unregistered, when a name is
        # not SCREAMING_SNAKE_CASE (the rule that would have caught the
        # rebrand renaming Acureal_SKIP_* and silently killing those switches),
        # or when a secret is marked browser-readable. Vite inlines every VITE_*
        # value into the bundle, so the prefix is the boundary — not a label in
        # a hosting dashboard.
        run: node scripts/check-env-manifest.js
      - name: PostgREST exposure guard (static migration scan)
        # Acureal has two doors into the database: the Express API and
        # Supabase's PostgREST Data API. Only the first was ever reviewed, and
        # in Aug 2026 the second was found granting `anon` full CRUD on every
        # table plus EXECUTE on the auth SECURITY DEFINER helpers. 20260805
        # closed it; this stops a new migration reopening it. The live half is
        # the hourly api_exposure canary in healthCheck.service.js.
        run: node scripts/check-postgrest-exposure.js
      - name: Dependency advisories (fail on high/critical)
        # Audits all three workspaces at the same scopes as before: backend and
        # frontend with --omit=dev (the gate is for vulns in what SHIPS to
        # users, not build/test tooling like vite/esbuild/vitest that never
        # reaches a browser or a serverless function), the kernel in full.
        #
        # Wrapped in a script so the gate can hold a small, documented, EXPIRING
        # waiver. `npm audit` queries the live advisory DB, so it can redden a
        # branch that changed no dependency — and when the advisory has no
        # patched version to pin to (image-size, Aug 2026), raw `npm audit` left
        # only two options: block every merge indefinitely, or delete the gate.
        # A keyed, evidence-backed, expiring waiver is the honest third. See the
        # header of the script for the rules on when one is allowed.
        run: node scripts/check-npm-advisories.js
      - name: Moderate advisory snapshot (informational)
        if: always()
        continue-on-error: true
        run: |
          echo "::group::Backend moderate+ advisories"
          npm audit --audit-level=moderate --omit=dev --prefix backend || true
          echo "::endgroup::"
          echo "::group::Frontend moderate+ advisories"
          npm audit --audit-level=moderate --prefix frontend || true
          echo "::endgroup::"
          echo "::group::Kernel moderate+ advisories"
          npm audit --audit-level=moderate --prefix packages/financial-kernel || true
          echo "::endgroup::"

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [kernel, backend, frontend, audit]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [ "${{ needs.kernel.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.audit.result }}" != "success" ]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All checks passed."
